<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/favicon-bw.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marjan Portfolio</title>

  <!-- Preload Critical Image for Hero -->
  <link rel="preload" href="/images/hero_optimized/desktop/ezgif-frame-001.webp" as="image" fetchpriority="high" />
</head>

<body>
  <!-- Critical: Disable scroll restoration BEFORE React mounts -->
  <!-- This prevents the browser restoring mid-scroll on refresh -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    // Force scroll to top immediately — runs before any JS module
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
